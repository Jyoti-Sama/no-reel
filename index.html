<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Nothing Feed</title>

  <!-- PWA Metadata -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d0e15" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nothing" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <style>
    :root {
      --glow: #c9d4e6;
      --ink: #0d0e15;
      --hair: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
    }

    /* Vertical snapping container */
    #feed {
      position: absolute;
      inset: 0;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      overscroll-behavior-y: contain;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #feed::-webkit-scrollbar {
      display: none;
    }

    /* Card background with fluid dancing gradient */
    .reel {
      position: relative;
      width: 100%;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      justify-content: center;
      align-items: center;
      background-size: 300% 300%;
      animation: dancingGradient 9s ease infinite;
    }

    @keyframes dancingGradient {
      0% {
        background-position: 0% 50%;
        filter: hue-rotate(0deg);
      }
      50% {
        background-position: 100% 50%;
        filter: hue-rotate(25deg);
      }
      100% {
        background-position: 0% 50%;
        filter: hue-rotate(0deg);
      }
    }

    /* Centered reel number */
    .reel-number {
      font-size: clamp(5.5rem, 22vw, 8.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 4px 28px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }

    /* PWA install prompt banner */
    #install-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
      background: rgba(14, 17, 24, 0.85);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--hair);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    #install-bar[hidden] {
      display: none;
    }
    #install-bar p {
      font-size: 13px;
      color: var(--glow);
    }
    .install-btn {
      background: var(--glow);
      color: var(--ink);
      border: 0;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    .dismiss-btn {
      background: transparent;
      border: 0;
      font-size: 20px;
      color: var(--glow);
      cursor: pointer;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div id="feed"></div>

  <!-- PWA Install Banner -->
  <div id="install-bar" hidden>
    <p>Install Nothing Feed</p>
    <button class="install-btn" id="install-btn">Install</button>
    <button class="dismiss-btn" id="dismiss-btn" aria-label="Dismiss">×</button>
  </div>

  <script>
    /* ── Service Worker Registration ── */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    /* ── PWA Install Trigger ── */
    let deferredPrompt = null;
    const installBar = document.getElementById('install-bar');
    const installBtn = document.getElementById('install-btn');
    const dismissBtn = document.getElementById('dismiss-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBar.hidden = false;
    });

    installBtn.addEventListener('click', () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        installBar.hidden = true;
      });
    });

    dismissBtn.addEventListener('click', () => {
      installBar.hidden = true;
    });

    window.addEventListener('appinstalled', () => {
      installBar.hidden = true;
    });

    /* ── Dynamic Soothing Dancing Palettes ── */
    const feed = document.getElementById('feed');
    let reelCount = 0;
    let lastSnapIndex = -1;

    const soothingPalettes = [
      "linear-gradient(135deg, #1b2838, #2c3e50, #4ca1af)",
      "linear-gradient(135deg, #2b1055, #7597de, #24243e)",
      "linear-gradient(135deg, #093028, #237a57, #114357)",
      "linear-gradient(135deg, #3a1c71, #d76d77, #ffaf7b)",
      "linear-gradient(135deg, #141e30, #243b55, #4b6cb7)",
      "linear-gradient(135deg, #1f1c2c, #928dab, #360033)",
      "linear-gradient(135deg, #0f2027, #203a43, #2c5364)",
      "linear-gradient(135deg, #2c3e50, #3498db, #2980b9)"
    ];

    /* Heavy Haptic Pulse */
    function triggerStrongHaptic() {
      if ('vibrate' in navigator) {
        navigator.vibrate([45, 25, 60]);
      }
    }

    /* Generate Card with Rotating Color Gradients */
    function createReel(index) {
      const card = document.createElement('div');
      card.className = 'reel';
      card.style.backgroundImage = soothingPalettes[(index - 1) % soothingPalettes.length];

      const number = document.createElement('div');
      number.className = 'reel-number';
      number.textContent = index;

      card.appendChild(number);
      return card;
    }

    function addReels(count = 5) {
      const frag = document.createDocumentFragment();
      for (let i = 0; i < count; i++) {
        reelCount++;
        frag.appendChild(createReel(reelCount));
      }
      feed.appendChild(frag);
    }

    // Initialize starting reels at 1
    addReels(5);

    /* ── Scroll Tracking & Haptics ── */
    feed.addEventListener('scroll', () => {
      const h = feed.clientHeight || 1;
      const activeIdx = Math.round(feed.scrollTop / h) + 1;

      if (activeIdx !== lastSnapIndex && activeIdx > 0) {
        lastSnapIndex = activeIdx;
        triggerStrongHaptic();
      }

      // Infinite load buffer
      if (feed.scrollTop + feed.clientHeight >= feed.scrollHeight - (h * 2)) {
        addReels(4);
      }
    }, { passive: true });
  </script>
</body>
</html>
