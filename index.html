<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Nothing Feed</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d0e15" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0c10;
    }

    /* Snap container for the vertical reels */
    #feed-container {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #feed-container::-webkit-scrollbar {
      display: none;
    }

    /* Individual reel card */
    .reel {
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background-size: 300% 300%;
      animation: soothingFlow 12s ease infinite;
    }

    /* Subtle, soothing flowing gradient animation */
    @keyframes soothingFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Centered reel number count */
    .reel-number {
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: -2px;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      transition: transform 0.2s ease-out;
    }
  </style>
</head>
<body>

  <div id="feed-container"></div>

  <script>
    const container = document.getElementById("feed-container");
    let reelCounter = 0;
    let lastHapticIndex = -1;

    // Rich, calm atmospheric color palettes
    const soothingGradients = [
      "linear-gradient(135deg, #1f1c2c, #928dab, #2c3e50)",
      "linear-gradient(135deg, #0f2027, #203a43, #2c5364)",
      "linear-gradient(135deg, #2b5876, #4e4376, #141e30)",
      "linear-gradient(135deg, #141e30, #243b55, #1e3c72)",
      "linear-gradient(135deg, #232526, #414345, #1f1c2c)",
      "linear-gradient(135deg, #134e5e, #71b280, #0f2027)",
      "linear-gradient(135deg, #3a1c71, #d76d77, #283048)",
      "linear-gradient(135deg, #1e130c, #9a8478, #2c3e50)",
      "linear-gradient(135deg, #000428, #004e92, #0d1b2a)"
    ];

    // Stronger haptic feedback (punchy dual impact)
    function triggerStrongHaptic() {
      if ("vibrate" in navigator) {
        navigator.vibrate([40, 30, 60]);
      }
    }

    // Append a reel card with animated gradient and centered number
    function appendReel() {
      reelCounter++;
      const reel = document.createElement("div");
      reel.className = "reel";
      reel.dataset.index = reelCounter;

      const gradient = soothingGradients[(reelCounter - 1) % soothingGradients.length];
      reel.style.backgroundImage = gradient;

      const number = document.createElement("div");
      number.className = "reel-number";
      number.textContent = reelCounter;

      reel.appendChild(number);
      container.appendChild(reel);
    }

    // Initialize the first reels starting from #1
    for (let i = 0; i < 5; i++) {
      appendReel();
    }

    // Infinite scroll & haptic detection on active reel change
    container.addEventListener("scroll", () => {
      const scrollPos = container.scrollTop;
      const height = container.clientHeight;
      const currentIndex = Math.round(scrollPos / height) + 1;

      // Haptic triggers once per newly focused reel
      if (currentIndex !== lastHapticIndex && currentIndex > 0) {
        lastHapticIndex = currentIndex;
        triggerStrongHaptic();
      }

      // Add more items when approaching the bottom
      if (container.scrollTop + container.clientHeight >= container.scrollHeight - (container.clientHeight * 2)) {
        appendReel();
      }
    });

    // Register service worker if available
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
